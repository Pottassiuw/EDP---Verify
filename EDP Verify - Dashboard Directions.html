<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDP Verify — Direções do painel</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #f0eee9; }
    #root { height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="directionA.jsx"></script>
  <script type="text/babel" src="directionB.jsx"></script>
  <script type="text/babel" src="directionC.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="directions" title="EDP Verify · três direções para o painel"
                     subtitle="Mesmos dados, mesma marca — três formas de exibir as notas bloqueadas no SAP. Tema escuro (assinatura).">
            <DCArtboard id="a" label="A · Registro Refinado — a tabela, modernizada" width={1380} height={904}>
              <DirRefinedLedger theme="dark" density="cozy" />
            </DCArtboard>
            <DCArtboard id="b" label="B · Bancada de Triagem — lista + detalhe lado a lado" width={1380} height={904}>
              <DirTriage theme="dark" density="cozy" />
            </DCArtboard>
            <DCArtboard id="c" label="C · Quadro de Insights — agrupado por bloqueio" width={1380} height={904}>
              <DirInsightBoard theme="dark" density="cozy" />
            </DCArtboard>
          </DCSection>

          <DCSection id="theming" title="Tema & densidade"
                     subtitle="Os mesmos tokens respondem a claro/escuro e compacto/confortável — controles que entram como Tweaks na versão final.">
            <DCArtboard id="a-light" label="A · Claro · Confortável" width={1380} height={904}>
              <DirRefinedLedger theme="light" density="cozy" />
            </DCArtboard>
            <DCArtboard id="a-compact" label="A · Claro · Compacto" width={1380} height={904}>
              <DirRefinedLedger theme="light" density="compact" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#161e2b"/>
      <circle cx="50" cy="50" r="26" fill="none" stroke="#6b5ce6" stroke-width="6"/>
      <circle cx="50" cy="50" r="16" fill="none" stroke="#1f9fd6" stroke-width="6"/>
      <circle cx="50" cy="50" r="7" fill="none" stroke="#00a859" stroke-width="6"/>
    </svg>
  </template>
</body>
</html>
